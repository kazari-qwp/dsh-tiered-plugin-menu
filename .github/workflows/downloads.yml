name: Download center

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/downloads.yml']
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  # Release dispatchers must not compete with the master deployment they queue.
  group: ${{ github.event_name == 'release' && format('pages-release-{0}', github.run_id) || 'github-pages' }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # workflow_dispatch is allowed to trigger another run with GITHUB_TOKEN.
      # Do not check out or execute code from the release tag.
      - name: Refresh download center on master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run downloads.yml --repo "$GH_REPO" --ref master

  build:
    # Checking out master does not change a release run's tag-based GITHUB_REF.
    if: github.event_name != 'release' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Check independent component lists
        run: node --test site/build.test.mjs
      - name: Build download center from releases
        run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download center
        id: deployment
        uses: actions/deploy-pages@v4
