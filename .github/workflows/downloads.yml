name: Download center

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/downloads.yml']
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Check independent component lists
        run: node --test site/build.test.mjs
      - name: Build download center from releases
        run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download center
        id: deployment
        uses: actions/deploy-pages@v4
